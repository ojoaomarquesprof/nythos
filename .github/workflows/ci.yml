name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: fake-anon-key-for-ci
      SUPABASE_SERVICE_ROLE_KEY: fake-service-role-key-for-ci
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      PATIENT_SESSION_SECRET: ci-only-patient-session-secret-change-in-production
      STRIPE_CHECKOUT_ENABLED: "false"
      ASAAS_CHECKOUT_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit --pretty false

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # Lint is intentionally not blocking CI yet. The global ESLint debt is
      # tracked separately and should be enabled here after it is reduced.
